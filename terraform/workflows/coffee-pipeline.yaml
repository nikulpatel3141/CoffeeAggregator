# Cloud Workflows definition for Coffee Aggregator pipeline
# This workflow orchestrates the scraper and builder services as a single pipeline

main:
  steps:
    - init:
        assign:
          - project_id: $${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - region: "europe-west2"
          - scraper_url: ${scraper_url}
          - builder_url: ${builder_url}

    - log_start:
        call: sys.log
        args:
          text: "Starting Coffee Aggregator pipeline"
          severity: INFO

    # Step 1: Run the scraper
    - run_scraper:
        call: http.post
        args:
          url: $${scraper_url}
          auth:
            type: OIDC
        result: scraper_response

    - log_scraper_complete:
        call: sys.log
        args:
          text: "Scraper completed"
          severity: INFO

    - check_scraper_success:
        switch:
          - condition: $${scraper_response.code == 200}
            next: run_builder
        next: scraper_failed_log

    # Step 2: Run the builder
    - run_builder:
        call: http.post
        args:
          url: $${builder_url}
          auth:
            type: OIDC
        result: builder_response

    - log_builder_complete:
        call: sys.log
        args:
          text: "Builder completed"
          severity: INFO

    - check_builder_success:
        switch:
          - condition: $${builder_response.code == 200}
            next: pipeline_success_log
        next: builder_failed_log

    # Success path
    - pipeline_success_log:
        call: sys.log
        args:
          text: "Pipeline completed successfully"
          severity: INFO

    - pipeline_success:
        return: "SUCCESS"

    # Error paths
    - scraper_failed_log:
        call: sys.log
        args:
          text: "Scraper failed"
          severity: ERROR

    - scraper_failed:
        raise:
          message: "Scraper failed"

    - builder_failed_log:
        call: sys.log
        args:
          text: "Builder failed"
          severity: ERROR

    - builder_failed:
        raise:
          message: "Builder failed"
