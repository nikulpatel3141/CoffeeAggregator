version: '3.8'

services:
  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GCP_PROJECT_ID=coffee-aggregator-project
      # For local testing without real GCP credentials, the scraper will fail
      # but you can see startup logs
    command: /usr/local/bin/coffee-scraper

  builder:
    build:
      context: ./builder
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - GCP_PROJECT_ID=coffee-aggregator-project
      - REPO_URL=github.com/your-user/CoffeeAggregator
      - TARGET_BRANCH=gh-pages
      # Add GitHub App credentials or GITHUB_TOKEN here if testing locally
    command: /app/coffee-builder
